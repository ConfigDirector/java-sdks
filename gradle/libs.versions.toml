[versions]
assertj = "3.27.7"
awaitility = "4.3.0"
errorprone = "2.50.0"
gson = "2.14.0"
jackson = "2.22.2"
junit-jupiter = "6.1.3"
logback = "1.6.3"
okhttp = "5.5.0"
slf4j = "2.0.18"

[libraries]
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

[plugins]
errorprone = { id = "net.ltgt.errorprone", version = "5.1.0" }
maven-publish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
micronaut-application = { id = "io.micronaut.application", version = "5.0.2" }
spring-boot = { id = "org.springframework.boot", version = "4.1.1" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }
spotbugs = { id = "com.github.spotbugs", version = "6.5.11" }
