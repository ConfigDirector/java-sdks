import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java-library'
    alias libs.plugins.errorprone
    alias libs.plugins.spotbugs
    alias libs.plugins.maven.publish
}

group = 'com.configdirector'
version = '1.2.0'

repositories {
    mavenCentral()
}

dependencies {
    api libs.okhttp
    api libs.slf4j.api

    implementation libs.gson

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.awaitility
    testImplementation libs.jackson.databind
    testImplementation libs.logback.classic
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    errorprone libs.errorprone.core
}

java {
    // 21 runs the build's tooling -- Error Prone needs it. What the SDK itself may use is pinned
    // by options.release below, not by this.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The bytecode is always Java 17. This runs the suite on a different JVM, which is what makes
// CI's runtime matrix mean anything: without it the pinned toolchain would run every job.
def testJavaVersion = providers.gradleProperty('testJavaVersion')

// Where the cross-SDK contract cases live. ConformanceTest skips itself without it, since the
// file belongs to the targeting-rules-contract repository rather than to this one.
def conformanceCases = providers.environmentVariable('CONFORMANCE_CASES')
def conformanceOutput = providers.environmentVariable('CONFORMANCE_OUTPUT')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // The minimum Java the SDK supports. --release checks against the real 17 API rather than
    // just emitting 17 bytecode, so a call to anything newer fails the build here rather than
    // NoSuchMethodError-ing in a consumer running 17.
    options.release = 17

    options.compilerArgs << '-Xlint:all' << '-Werror'

    options.errorprone {
        // Findings are warnings, which -Werror above turns into build failures.
        disableWarningsInGeneratedCode = true
    }
}

tasks.named('javadoc') {
    // What a consumer can call. com.configdirector.internal is implementation detail: it carries
    // no docs by convention, and publishing it would invite calls into it.
    exclude 'com/configdirector/internal/**'
    options.encoding = 'UTF-8'
    // The published API is what javadoc.io renders, so an undocumented member or a stale @param
    // fails the build here rather than showing up there.
    options.addBooleanOption('Xwerror', true)
}

// Not wired in by default, so without this the -Xwerror above would only bite at release time,
// when the javadoc jar is built.
tasks.named('check') {
    dependsOn tasks.named('javadoc')
}

tasks.named('jar') {
    manifest {
        attributes(
            'Implementation-Title': 'configdirector-server-sdk',
            'Implementation-Version': project.version,
            // Without this, a consumer on the module path gets a module name derived from the
            // file name, which changes whenever the artifact is renamed.
            'Automatic-Module-Name': 'com.configdirector'
        )
    }
    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }
}

// Bytecode analysis, which reaches things a javac plugin cannot -- notably a constructor that
// stores a caller's mutable collection rather than copying it.
spotbugs {
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('DEFAULT')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.named('test') {
    useJUnitPlatform()
    if (conformanceCases.present) {
        environment 'CONFORMANCE_CASES', conformanceCases.get()
    }
    if (conformanceOutput.present) {
        environment 'CONFORMANCE_OUTPUT', conformanceOutput.get()
    }
    if (testJavaVersion.present) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get() as Integer)
        }
    }
    // Several tests park a reader on a real socket, so a threading bug would surface as a suite
    // that never finishes rather than as a failure. This turns that back into a failure.
    timeout = Duration.ofMinutes(5)
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

mavenPublishing {
    // Uploads a signed bundle to the Central Portal and stops there: the deployment is released
    // by hand, so a green pipeline is not by itself a published version.
    publishToMavenCentral()

    // Central requires signatures, and only the release pipeline holds the key. Publishing to the
    // local cache to try a build against a consumer must not need one, so this is conditional
    // rather than unconditional; an unsigned bundle is rejected by the Portal, not published.
    if (providers.gradleProperty('signingInMemoryKey').present
            || providers.gradleProperty('signing.keyId').present) {
        signAllPublications()
    }

    coordinates(group.toString(), 'configdirector-server-sdk', version.toString())

    pom {
        name = 'ConfigDirector Java Server SDK'
        description = 'Java server SDK for ConfigDirector. ConfigDirector is a remote ' +
            'configuration and feature flag service.'
        url = 'https://github.com/ConfigDirector/java-sdks'
        inceptionYear = '2026'

        licenses {
            license {
                name = 'MIT License'
                url = 'https://github.com/ConfigDirector/java-sdks/blob/main/LICENSE'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'configdirector'
                name = 'ConfigDirector'
                url = 'https://www.configdirector.com'
            }
        }

        scm {
            url = 'https://github.com/ConfigDirector/java-sdks'
            connection = 'scm:git:https://github.com/ConfigDirector/java-sdks.git'
            developerConnection = 'scm:git:ssh://git@github.com/ConfigDirector/java-sdks.git'
        }
    }
}
