import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
    id 'java-library'
    alias libs.plugins.errorprone
    alias libs.plugins.spotbugs
}

repositories {
    mavenCentral()
}

dependencies {
    // OkHttp owns sockets, connection pooling, TLS, redirects and per-read timeouts. The SSE
    // protocol on top of it is ours, so it stays behind the StreamOpener seam and no OkHttp type
    // appears in this SDK's own API.
    api libs.okhttp

    // A facade only. The consuming application supplies the binding.
    api libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.assertj.core
    testImplementation libs.awaitility
    // Used only by the conformance harness that targeting-rules-contract copies in for `make
    // check-java`. Test scope; the SDK itself has no JSON parser yet.
    testImplementation libs.jackson.databind
    // A binding at runtime, and a ListAppender for the tests that assert the SDK reports a
    // problem rather than swallowing it.
    testImplementation libs.logback.classic
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    errorprone libs.errorprone.core
}

java {
    // 21 runs the build's tooling -- Error Prone needs it. What the SDK itself may use is pinned
    // by options.release below, not by this.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// The bytecode is always Java 17. This runs the suite on a different JVM, which is what makes
// CI's runtime matrix mean anything: without it the pinned toolchain would run every job.
def testJavaVersion = providers.gradleProperty('testJavaVersion')

// Where the cross-SDK contract cases live. ConformanceTest skips itself without it, since the
// file belongs to the targeting-rules-contract repository rather than to this one.
def conformanceCases = providers.environmentVariable('CONFORMANCE_CASES')
def conformanceOutput = providers.environmentVariable('CONFORMANCE_OUTPUT')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    // The minimum Java the SDK supports. --release checks against the real 17 API rather than
    // just emitting 17 bytecode, so a call to anything newer fails the build here rather than
    // NoSuchMethodError-ing in a consumer running 17.
    options.release = 17

    options.compilerArgs << '-Xlint:all' << '-Werror'

    options.errorprone {
        // Findings are warnings, which -Werror above turns into build failures.
        disableWarningsInGeneratedCode = true
    }
}

// Bytecode analysis, which reaches things a javac plugin cannot -- notably a constructor that
// stores a caller's mutable collection rather than copying it.
spotbugs {
    effort = Effort.valueOf('MAX')
    reportLevel = Confidence.valueOf('DEFAULT')
    excludeFilter = file('config/spotbugs/exclude.xml')
}

tasks.named('test') {
    useJUnitPlatform()
    if (conformanceCases.present) {
        environment 'CONFORMANCE_CASES', conformanceCases.get()
    }
    if (conformanceOutput.present) {
        environment 'CONFORMANCE_OUTPUT', conformanceOutput.get()
    }
    if (testJavaVersion.present) {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(testJavaVersion.get() as Integer)
        }
    }
    // Several tests park a reader on a real socket, so a threading bug would surface as a suite
    // that never finishes rather than as a failure. This turns that back into a failure.
    timeout = Duration.ofMinutes(5)
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}
