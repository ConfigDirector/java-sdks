name: Release configdirector-server-sdk

# Deliberately manual. The version is whatever configdirector-server-sdk/build.gradle says, so a
# release is two steps: merge the version bump, then run this against main.
on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BUILD_JDK: "21"
  ARTIFACT: configdirector-server-sdk

  # The build below must exercise the sample against the SDK being released, not against whatever
  # version is already on Central.
  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Pushing the release tag.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # build.gradle is the only place the version lives, so ask Gradle for it rather than
      # parsing the file and having the two drift.
      - name: Resolve the version
        id: version
        run: |
          version=$(./gradlew -q :"$ARTIFACT":properties --property version | awk '/^version:/ {print $2}')
          if [[ -z $version ]]; then
            echo "::error::could not read the version of :$ARTIFACT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ARTIFACT-v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $ARTIFACT $version"

      - name: Refuse to re-release an existing version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n $(git ls-remote --tags origin "refs/tags/$TAG") ]]; then
            echo "::error::$TAG already exists, so $VERSION has been released from this workflow" \
                 "before. If that deployment was dropped in the Portal rather than published," \
                 "delete the tag and run this again; otherwise bump the version in" \
                 "$ARTIFACT/build.gradle."
            exit 1
          fi

      # The same checks CI runs. A version nobody can build is not worth uploading.
      - run: ./gradlew build

      # Uploads a signed bundle to the Central Portal and stops. The deployment is released from
      # the Portal by hand, which is the last chance to look at what is about to become permanent.
      - name: Publish to the Central Portal
        run: ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.ARTIFACT }}/build/libs/*.jar

      # Last, so that a bundle the Portal rejected does not leave a tag behind claiming it was
      # released. This marks the commit that was uploaded; whether it then became a permanent
      # version on Central is still a manual decision in the Portal. Tags are named per artifact
      # because this repository will publish more than one.
      - name: Tag the released commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$ARTIFACT $VERSION"
          git push origin "$TAG"
