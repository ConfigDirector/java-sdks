name: Release configdirector-openfeature-server-provider

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GRADLE_JDK: "25"
  SDK_TOOLCHAIN_JDK: "21"
  ARTIFACT: configdirector-openfeature-server-provider

  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up the SDK toolchain JDK
        id: sdk-toolchain-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.SDK_TOOLCHAIN_JDK }}

      - name: Set up the Gradle JDK
        id: gradle-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JDK }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          version=$(./gradlew -q :"$ARTIFACT":properties --property version | awk '/^version:/ {print $2}')
          if [[ -z $version ]]; then
            echo "::error::could not read the version of :$ARTIFACT"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$ARTIFACT-v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $ARTIFACT $version"

      - name: Refuse to re-release an existing version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ -n $(git ls-remote --tags origin "refs/tags/$TAG") ]]; then
            echo "::error::$TAG already exists, so $VERSION has been released from this workflow" \
                 "before. If that deployment was dropped in the Portal rather than published," \
                 "delete the tag and run this again; otherwise bump the version in" \
                 "$ARTIFACT/build.gradle."
            exit 1
          fi

      - run: >
          ./gradlew build
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}

      - name: Publish to the Central Portal
        run: >
          ./gradlew :"$ARTIFACT":publishToMavenCentral --no-configuration-cache
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: ${{ env.ARTIFACT }}/build/libs/*.jar

      - name: Tag the released commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$ARTIFACT $VERSION"
          git push origin "$TAG"
