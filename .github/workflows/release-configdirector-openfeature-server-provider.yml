name: Release configdirector-openfeature-server-provider

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Maven repository to publish to
        type: choice
        options:
          - dev
          - prod
        default: dev
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  GRADLE_JDK: "25"
  SDK_TOOLCHAIN_JDK: "21"
  MODULE: configdirector-openfeature-server-provider
  GROUP: com.configdirector
  ARTIFACT_ID: openfeature-server-provider
  STAGING_DIRECTORY: build/maven-repository
  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  publish:
    name: Publish to the ${{ inputs.repository }} Maven repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-${{ inputs.repository }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up the SDK toolchain JDK
        id: sdk-toolchain-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.SDK_TOOLCHAIN_JDK }}

      - name: Set up the Gradle JDK
        id: gradle-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JDK }}

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the version
        id: version
        run: |
          version=$(./gradlew -q :"$MODULE":properties --property version | awk '/^version:/ {print $2}')
          if [[ -z $version ]]; then
            echo "::error::could not read the version of :$MODULE"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$MODULE-v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $GROUP:$ARTIFACT_ID $version to the ${{ inputs.repository }} repository"

      - name: Refuse a version that is already in the Maven repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.MAVEN_REPOSITORY_BUCKET }}
          ENDPOINT: ${{ vars.MAVEN_REPOSITORY_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          .github/scripts/upload-to-maven-repository.sh check "$BUCKET" "$ENDPOINT"
          "$GROUP:$ARTIFACT_ID:$VERSION"

      - name: Build and test
        run: >
          ./gradlew build
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}

      - name: Publish the signed release into the staging repository
        run: >
          ./gradlew :"$MODULE":publishAllPublicationsToStagingRepository
          --no-configuration-cache
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Attest the jars and POM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ env.STAGING_DIRECTORY }}/**/*.jar
            ${{ env.STAGING_DIRECTORY }}/**/*.pom

      - name: Upload to the Maven repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.MAVEN_REPOSITORY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.MAVEN_REPOSITORY_SECRET_ACCESS_KEY }}
          BUCKET: ${{ vars.MAVEN_REPOSITORY_BUCKET }}
          ENDPOINT: ${{ vars.MAVEN_REPOSITORY_ENDPOINT }}
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          .github/scripts/upload-to-maven-repository.sh upload "$STAGING_DIRECTORY" "$BUCKET" "$ENDPOINT"
          "$GROUP:$ARTIFACT_ID:$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: maven-repository
          path: ${{ env.STAGING_DIRECTORY }}

      - name: Tag the released commit
        if: inputs.repository == 'prod'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "$MODULE $VERSION"
          git push origin "$TAG"
