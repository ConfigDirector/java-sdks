name: java-server-sdk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ./gradlew rather than gradlew.bat on every runner, including Windows.
defaults:
  run:
    shell: bash

env:
  # The version the library compiles against. The toolchain in the module's build.gradle pins the same
  # one, so installing it here is what keeps CI from downloading a JDK on every run.
  BUILD_JDK: '17'

jobs:
  build:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}

      # gradle-wrapper.jar is a binary in the repo, so its checksum is worth verifying.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Compiles under -Werror, runs the suite, and assembles the jar.
      - run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: configdirector-server-sdk/build/libs/*.jar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-build
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test

  os-compatibility:
    # Closing a socket out from under a parked reader is the one thing in this SDK that behaves
    # differently per platform, so close() and cancel() are worth exercising on each.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test

  runtime-compatibility:
    # Same Java 17 bytecode, run on the later LTS releases a consumer may deploy on.
    name: Test (JDK ${{ matrix.java }} runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v5

      - name: Set up the runtime JDK
        id: runtime-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      # Installed second so it becomes JAVA_HOME and Gradle itself runs on it.
      - name: Set up the build JDK
        id: build-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.BUILD_JDK }}

      - uses: gradle/actions/setup-gradle@v4

      # Pointing Gradle at both installations keeps it from provisioning a toolchain itself.
      - run: >
          ./gradlew test
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.paths=${{ steps.build-jdk.outputs.path }},${{ steps.runtime-jdk.outputs.path }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test
