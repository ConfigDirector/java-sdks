name: configdirector-server-sdk

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ./gradlew rather than gradlew.bat on every runner, including Windows.
defaults:
  run:
    shell: bash

env:
  GRADLE_JDK: "25"
  SDK_TOOLCHAIN_JDK: "21"

  # Points the sample at configdirector-server-sdk/ in this checkout rather than at its release on
  # Central, so a breaking API change fails here rather than after it ships. Set as a Gradle
  # project property through the environment, which every ./gradlew below picks up.
  ORG_GRADLE_PROJECT_useLocalSdk: "true"

jobs:
  build:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up the SDK toolchain JDK
        id: sdk-toolchain-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.SDK_TOOLCHAIN_JDK }}

      # Must be after the toolchain JDK since it sets JAVA_HOME
      - name: Set up the Gradle JDK
        id: gradle-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JDK }}

      # gradle-wrapper.jar is a binary in the repo, so its checksum is worth verifying.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - run: >
          ./gradlew build
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: configdirector-server-sdk/build/libs/*.jar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-build
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test

  os-compatibility:
    # Closing a socket out from under a parked reader is the one thing in this SDK that behaves
    # differently per platform, so close() and cancel() are worth exercising on each.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Set up the SDK toolchain JDK
        id: sdk-toolchain-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.SDK_TOOLCHAIN_JDK }}

      - name: Set up the Gradle JDK
        id: gradle-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JDK }}

      - uses: gradle/actions/setup-gradle@v4

      - run: >
          ./gradlew test
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.os }}
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test

  runtime-compatibility:
    name: Test (JDK ${{ matrix.java }} runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up the runtime JDK
        id: runtime-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up the SDK toolchain JDK
        id: sdk-toolchain-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.SDK_TOOLCHAIN_JDK }}

      - name: Set up the Gradle JDK
        id: gradle-jdk
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.GRADLE_JDK }}

      - uses: gradle/actions/setup-gradle@v4

      - run: >
          ./gradlew test
          -PtestJavaVersion=${{ matrix.java }}
          -Porg.gradle.java.installations.paths=${{ steps.gradle-jdk.outputs.path }},${{ steps.sdk-toolchain-jdk.outputs.path }},${{ steps.runtime-jdk.outputs.path }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-jdk${{ matrix.java }}
          path: |
            configdirector-server-sdk/build/reports/tests/test
            configdirector-server-sdk/build/test-results/test
