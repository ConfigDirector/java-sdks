plugins {
    // Provisions a matching JDK when the toolchain the build asks for is not installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// The root is the repository; the module below is the published artifact.
rootProject.name = 'configdirector-java-server-sdk'

include('configdirector-server-sdk')

// Not published. It depends on the SDK release on Maven Central, the way a real consumer does;
// -PuseLocalSdk swaps in the module above instead, which is how CI makes a breaking API change
// fail here first. Samples are grouped by the artifact they demonstrate, since this repository
// will hold more than one.
include('samples:configdirector-server-sdk:spring-boot')
include('samples:configdirector-server-sdk:micronaut')
