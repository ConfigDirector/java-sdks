micronaut.application.name=configdirector-micronaut-sample
micronaut.server.port=3601

# Micronaut's environment property source already understands the SCREAMING_SNAKE_CASE spelling of
# every key below, so these are just the defaults: exporting CONFIGDIRECTOR_SERVER_KEY overrides
# configdirector.server-key with nothing else declared here.

# A secret. Supply it as CONFIGDIRECTOR_SERVER_KEY rather than editing this file; without a real
# one the client stays unready and every config falls back to the default the app passes in.
configdirector.server-key=fake-sample-key

# Only needed when routing through a proxy to reach ConfigDirector.
# configdirector.base-url=https://proxy.internal/configdirector

# streaming, polling, or one-time.
configdirector.mode=streaming
configdirector.timeout=3s

# Set CONFIGDIRECTOR_LOG_LEVEL=DEBUG to watch every evaluation as it happens. This one needs the
# placeholder because the logger name is not derived from the variable name.
logger.levels.sample.configdirector=${configdirector.log-level:INFO}
