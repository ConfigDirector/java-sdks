# No quarkus.application.name here, unlike the sibling samples. Quarkus fixes the name at build
# time but quarkusRun re-supplies it at runtime from the Gradle project name, so setting it earns
# a "build time property cannot be changed at runtime" warning on every start. Left alone, both
# agree on the project name.
quarkus.http.port=3602

# MicroProfile Config already understands the SCREAMING_SNAKE_CASE spelling of every key below, in
# the environment and in .env alike, so these are just the defaults: exporting
# CONFIGDIRECTOR_SERVER_KEY overrides configdirector.server-key with nothing else declared here.

# A secret. Supply it as CONFIGDIRECTOR_SERVER_KEY rather than editing this file; without a real
# one the client stays unready and every config falls back to the default the app passes in.
configdirector.server-key=fake-sample-key

# Only needed when routing through a proxy to reach ConfigDirector.
# configdirector.base-url=https://proxy.internal/configdirector

# streaming or polling.
configdirector.mode=streaming
configdirector.timeout=3s

# Set CONFIGDIRECTOR_LOG_LEVEL=DEBUG to watch every evaluation as it happens. This one needs the
# expression because the logger category is not derived from the variable name.
configdirector.log-level=INFO
quarkus.log.category."sample.configdirector".level=${configdirector.log-level}
