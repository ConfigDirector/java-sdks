plugins {
    id 'java'
    alias libs.plugins.spring.boot
    alias libs.plugins.spring.dependency.management
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'ConfigDirector'
                url = 'https://maven.configdirector.com'
            }
        }
        filter {
            includeGroup 'com.configdirector'
        }
    }
}

// -PuseLocalSdk builds against configdirector-server-sdk/ in this repository instead of the
// release in the ConfigDirector Maven repository. CI sets it so that a breaking API change fails
// here first; locally it is how you try an unreleased SDK change against a real consumer.
def useLocalSdk = providers.gradleProperty('useLocalSdk')
    .map { it.isEmpty() || Boolean.parseBoolean(it) }
    .getOrElse(false)

dependencies {
    // The latest released SDK, which is what a reader copying this line wants. It deliberately
    // lags the version in configdirector-server-sdk/build.gradle between a version bump and the
    // release that publishes it -- naming an unpublished version here leaves the sample
    // unresolvable for everyone who is not passing -PuseLocalSdk below.
    implementation useLocalSdk
        ? project(':configdirector-server-sdk')
        : 'com.configdirector:server-sdk:1.8.0'
    testImplementation useLocalSdk
        ? project(':configdirector-server-sdk-testing')
        : 'com.configdirector:server-sdk-testing:1.8.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // The SDK's floor, so the sample cannot accidentally demonstrate an API a consumer on 17
    // could not call.
    options.release = 17
}

tasks.named('test') {
    useJUnitPlatform()
}
