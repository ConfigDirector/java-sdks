# Loads a .env file sitting next to this sample, if there is one. Spring has no .env format of
# its own, so [.properties] tells it to parse the file as KEY=value pairs; optional: means the app
# still starts when the file is absent.
spring.config.import=optional:file:.env[.properties]

spring.application.name=configdirector-spring-boot-sample
server.port=3600

# A secret. Supply it as CONFIGDIRECTOR_SERVER_KEY rather than editing this file; without a real
# one the client stays unready and every config falls back to the default the app passes in.
configdirector.server-key=${CONFIGDIRECTOR_SERVER_KEY:fake-sample-key}

# Only needed when routing through a proxy to reach ConfigDirector.
configdirector.base-url=${CONFIGDIRECTOR_BASE_URL:}

# streaming or polling.
configdirector.mode=${CONFIGDIRECTOR_MODE:streaming}
configdirector.timeout=${CONFIGDIRECTOR_TIMEOUT:3s}

# Set to DEBUG to watch every evaluation as it happens.
logging.level.sample.configdirector=${CONFIGDIRECTOR_LOG_LEVEL:INFO}
